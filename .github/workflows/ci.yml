name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:                          # your existing job — runs tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  docker-build:                  # NEW — builds the image to prove it works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t messy-orders .